name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Secrets and private extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gitleaks CLI (MIT) scans the full history. gitleaks-action needs a
      # paid licence key for organisation repositories, so it is not used.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

      - name: Private extensions and the POC are never committed
        run: |
          tracked="$(git ls-files | grep -E '\.kalaoext$|^android/extensions/|^poc-webapp/' || true)"
          if [[ -n "$tracked" ]]; then
            echo "These files must not be in the public repository:" >&2
            echo "$tracked" >&2
            exit 1
          fi

  flutter:
    name: Flutter format, analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: android/.fvmrc
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check formatting
        id: format
        run: |
          dart format lib test
          git diff > /tmp/dart-format.patch
          git diff --stat --exit-code

      - name: Upload the formatting fix
        if: failure() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dart-format-patch
          path: /tmp/dart-format.patch

      # Analyze and test still run when only formatting failed.
      - name: Analyze
        if: success() || steps.format.outcome == 'failure'
        run: flutter analyze

      - name: Run tests
        if: success() || steps.format.outcome == 'failure'
        run: flutter test

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ALSA headers (cpal host build)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config libclang-dev

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup toolchain install

      # Restore everywhere, save only from main (the Save step below), so pull
      # requests do not push the repository past its cache quota.
      - name: Restore Cargo registry and build output
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: cargo-${{ runner.os }}-rust-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-${{ hashFiles('rust_backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-rust-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-

      - name: Rust formatting, Clippy and unit tests
        run: bash scripts/check_rust_backend.sh

      - name: Save Cargo registry and build output
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  android:
    name: Android build & native tests
    runs-on: ubuntu-latest
    env:
      # JDK 25 warns when Gradle's launcher loads its native library.
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: android/.fvmrc
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.2"

      - name: Install Android SDK & NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Install ALSA headers (cpal host build)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config libclang-dev

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup toolchain install

      # Restore everywhere, save only from main (the Save step below), so pull
      # requests do not push the repository past its cache quota.
      - name: Restore Cargo registry and build output
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: cargo-${{ runner.os }}-android-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-${{ hashFiles('rust_backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-android-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-

      - name: Get Flutter dependencies
        working-directory: android
        run: flutter pub get

      - name: Configure Flutter SDK for Gradle
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/android/local.properties

      - name: Package Rust application and run native unit tests
        run: gradle -p android/android :app:assembleDebug :app:testDebugUnitTest

      - name: Build and audit release APKs
        run: bash scripts/build_android.sh

      - name: Save Cargo registry and build output
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Verify APK signatures
        run: |
          for apk in android/build/app/outputs/flutter-apk/app-*release.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" -J-enable-native-access=ALL-UNNAMED verify "$apk"
            "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$apk"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kalao-debug-apk-${{ github.sha }}
          retention-days: 14
          path: android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
