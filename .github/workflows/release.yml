# LGPL-3.0-only. Modified for Kalao.
#
# Tag vX.Y.Z (or run manually) to publish a GitHub Release: signed per-ABI and
# universal APKs, V4 signature files, SHA256SUMS.txt and a git-cliff changelog.
# Requires the repository secrets KEYSTORE_BASE64, KEY_ALIAS,
# KEYSTORE_PASSWORD and optionally KEY_PASSWORD.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Get version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          lower=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
          if [[ "$lower" == *-preview* || "$lower" == *-beta* || "$lower" == *-rc* || "$lower" == *-alpha* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    runs-on: ubuntu-latest
    needs: get-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the version matches pubspec.yaml
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          pubspec="$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' android/pubspec.yaml)"
          if [[ "${VERSION#v}" != "$pubspec"* ]]; then
            echo "Tag $VERSION does not match android/pubspec.yaml version $pubspec" >&2
            exit 1
          fi

      - name: Install ALSA headers (cpal host build)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config libclang-dev

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Install Android SDK & NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: android/.fvmrc
          cache: true

      - name: Get Flutter dependencies
        working-directory: android
        run: flutter pub get

      - name: Build release APKs
        run: bash scripts/build_android.sh

      - name: Sign and verify release APKs (V1/V2/V3/V4)
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
          export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/kalao-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          apk_dir=android/build/app/outputs/flutter-apk
          mkdir -p release

          for target in arm64-v8a:arm64 armeabi-v7a:arm32 x86_64:x86_64 universal:universal; do
            abi="${target%%:*}"
            label="${target##*:}"
            source="$apk_dir/app-${abi}-release.apk"
            [[ "$abi" == universal ]] && source="$apk_dir/app-release.apk"
            apk="release/Kalao-${VERSION}-${label}.apk"
            "$apksigner" sign \
              --ks "$signing_dir/release.jks" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled true \
              --out "$apk" "$source"
            test -s "$apk.idsig"
            report="$("$apksigner" verify --verbose --print-certs --v4-signature-file "$apk.idsig" "$apk")"
            for scheme in 1 2 3 4; do
              grep -Eq "Verified using v${scheme} scheme.*: true" <<< "$report" || {
                echo "ERROR: APK signature V${scheme} did not verify: $apk" >&2
                exit 1
              }
            done
            if grep -qi "Android Debug" <<< "$report"; then
              echo "ERROR: Refusing to publish a debug-signed APK" >&2
              exit 1
            fi
          done

      - name: Audit signed APKs
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          python3 scripts/check_backend_apk.py "release/Kalao-${VERSION}-arm64.apk" --abis arm64-v8a
          python3 scripts/check_backend_apk.py "release/Kalao-${VERSION}-arm32.apk" --abis armeabi-v7a
          python3 scripts/check_backend_apk.py "release/Kalao-${VERSION}-x86_64.apk" --abis x86_64
          python3 scripts/check_backend_apk.py "release/Kalao-${VERSION}-universal.apk" --abis arm64-v8a,armeabi-v7a,x86_64
          for apk in release/Kalao-*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$apk"
          done
          (cd release && sha256sum Kalao-* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Retain Android debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-symbols-${{ needs.get-version.outputs.version }}-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            android/build/symbols/android/
            android/build/app/outputs/mapping/release/mapping.txt

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          if-no-files-found: error
          path: release/

  create-release:
    runs-on: ubuntu-latest
    needs: [get-version, build-android]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: /tmp/changelog.txt

      - name: Download APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: ./release

      - name: Verify checksums and write the release body
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          (cd release && sha256sum --check SHA256SUMS.txt)
          cp /tmp/changelog.txt /tmp/release_body.txt
          cat >> /tmp/release_body.txt << FOOTER

          ---

          ### Downloads
          - **arm64**: \`Kalao-${VERSION}-arm64.apk\` (most phones)
          - **arm32**: \`Kalao-${VERSION}-arm32.apk\` (older phones)
          - **x86_64**: \`Kalao-${VERSION}-x86_64.apk\` (emulators, Chromebooks)
          - **universal**: \`Kalao-${VERSION}-universal.apk\` (any device, larger)
          - \`*.apk.idsig\`: V4 signatures for \`adb install --incremental\` only

          \`SHA256SUMS.txt\` lists the SHA-256 of every file above.

          Kalao is distributed only through GitHub Releases. Enable installing
          from unknown sources for your browser or file manager, then open the APK.

          If you'd like to support this project: https://ko-fi.com/brinsley
          FOOTER

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: Kalao ${{ needs.get-version.outputs.version }}
          body_path: /tmp/release_body.txt
          files: ./release/*
          draft: false
          prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
