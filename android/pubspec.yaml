name: kalao
description: Kalao, an on-device karaoke and lyrics-learning app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0

# Versions follow Mornye's pins (docs/LIBRARIES.md). Packages are added in the
# milestone that first uses them.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_riverpod: ^3.4.2
  go_router: ^18.1.2
  shared_preferences: ^2.5.6
  # v11 removes legacy Android readers; keep Mornye's compatibility release.
  flutter_secure_storage: 10.3.4
  path_provider: ^2.1.6
  path: ^1.9.1
  # M1: library, import, playback, theme
  sqflite: ^2.4.5
  file_picker: ^13.3.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  ffmpeg_kit_flutter_new_audio: 2.5.7
  dynamic_color: ^2.1.0
  material_ui: ^1.9.0
  url_launcher: 6.3.3
  share_plus: 13.3.1
  http: 1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/licenses/
